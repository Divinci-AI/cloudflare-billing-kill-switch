name = "cloudflare-billing-kill-switch"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Check usage every 15 minutes. Adjust as needed:
#   "*/5 * * * *"   = every 5 minutes (aggressive)
#   "*/15 * * * *"  = every 15 minutes (current — relaxed from */5 on 2026-07-23)
#   "0 * * * *"     = every hour
#   "0 */6 * * *"   = every 6 hours (default)
#   "0 0 * * *"     = once daily
#
# Relaxed 2026-07-23: each tick fires ~7 Cloudflare GraphQL Analytics queries
# (Workers, DO, AI Inference, AI Gateway, Vectorize, R2, D1/Queue usage). At
# */5 that's ~2000 GraphQL calls/day against what appears to be an
# account-wide (not per-token) analytics rate limit — during the WAF incident
# this same day, a completely different API token got "rate limiter budget
# depleted" on firewallEventsAdaptive queries for 10+ minutes straight while
# idle otherwise. */15 cuts this worker's GraphQL volume ~3x (~670/day) while
# still catching a genuine cost runaway within 15 min — well inside the
# 10x DISCONNECT_THRESHOLD_MULTIPLIER safety margin and the 6h alert cooldown.
[triggers]
crons = ["*/15 * * * *"]

# Alert de-dup state (edge-triggered webhook alerts). Optional: if removed,
# de-dup becomes a no-op and chatty channels repeat every check.
[[kv_namespaces]]
binding = "ALERT_STATE"
id = "70af5e6edb8b414ab96f6bbb0618b4be"

# PagerDuty Events API v2 routing key, sourced from the account Secrets Store.
# Declared here so `wrangler deploy` preserves the binding — it was previously
# attached out-of-band (dashboard/API) and an undeclared deploy would DROP it,
# silently disarming PagerDuty alerting. (Audited 2026-06-27.)
[[secrets_store_secrets]]
binding = "PAGERDUTY_ROUTING_KEY"
store_id = "0b7ac993cf26413ea6e2f1b5ede20b25"
secret_name = "PAGERDUTY_ROUTING_KEY"

[vars]
ENVIRONMENT = "production"

# ── MongoDB Atlas pause detection ────────────────────────────────────────────
# Datadog site + the DB-symptom monitor(s) to mute via downtime while prod Atlas
# is deliberately paused (the CF 5xx monitor fires on the edge-visible 503s a
# paused cluster produces). Atlas API keys + DD_API_KEY/DD_APP_KEY are secrets.
DD_SITE = "us5.datadoghq.com"
DD_DB_SYMPTOM_MONITOR_IDS = "20807649"

# Datadog status-page ids. Declared here purely so `wrangler deploy` PRESERVES
# them: both were attached out-of-band and `deploy` replaces plain-text vars
# wholesale from this file, so an undeclared deploy silently drops them — the
# same trap documented above for PAGERDUTY_ROUTING_KEY, still live for these two
# (caught 2026-07-31 by diffing deployed bindings against this file before a
# deploy). Nothing in src/ reads them today; kept rather than dropped because
# they were set deliberately and losing config by accident is not a decision.
DD_STATUS_PAGE_ID = "890d7118-a4d5-45d1-8f74-88858a16fa4b"
DD_STATUS_COMPONENT_PLATFORM = "0987f6a7-11a9-44e8-a591-ab410bc0b5b2"

# ── Kill Switch Service (https://kill-switch.net) ────────────────────────────
# Centralized monitoring & alerting. The agent reports usage metrics to
# kill-switch.net after each check, enabling multi-cloud dashboards & rules.
KILL_SWITCH_API_URL = "https://api.kill-switch.net"
# KILL_SWITCH_AGENT_API_KEY → set via `wrangler secret put KILL_SWITCH_AGENT_API_KEY`

# ── Cloudflare Thresholds ───────────────────────────────────────────────────
# Alerts fire when ANY worker exceeds these thresholds in a single day.
# Set based on your normal usage patterns. Start conservative, tune over time.

# Durable Object requests per day (default: 10 million)
# Context: DO requests cost $0.15/million — even 10M/day is only ~$1.50.
# Tuned 2026-06-17: the as-above-voice-agent DO does ~1.5M reqs/day of LEGIT
# voice traffic ($0.23/day); the old 1M threshold fired on it every check.
# 10M gives ~6× headroom over current real usage while still catching a true
# runaway (and the 10× DISCONNECT multiplier means kill only above 100M/day).
DO_REQUEST_THRESHOLD = "10000000"

# Durable Object wall-time per day in hours (default: 100 hours)
# Context: DO duration costs $12.50/million GB-seconds. Long-running
# WebSocket DOs or Containers can accumulate wall-time quickly.
DO_WALLTIME_HOURS_THRESHOLD = "100"

# Worker requests per day (default: 10 million)
# Context: Catches feedback loops (Worker -> Queue -> Worker) that can
# generate millions of requests in minutes. Standard Workers cost
# $0.30/million after 10M free.
WORKER_REQUEST_THRESHOLD = "10000000"

# R2 operations per day (class A + B combined, default: 50 million)
# Context: Class A (PUT/DELETE/LIST) = $4.50/million, Class B (GET/HEAD) = $0.36/million
R2_OPS_THRESHOLD = "50000000"

# D1 rows written per day (default: 10 million)
# Context: $1.00/million rows written after 50M free/month
D1_ROWS_WRITTEN_THRESHOLD = "10000000"

# D1 rows read per day (default: 10 billion)
# Context: $0.001/million rows read after 25B free/month. Very cheap.
# Normal daily usage: ~4B reads across top databases.
D1_ROWS_READ_THRESHOLD = "10000000000"

# Queue messages per day (produced + consumed, default: 50 million)
# Context: $0.40/million messages
QUEUE_MESSAGES_THRESHOLD = "50000000"

# ── SDK Docs Monitoring Thresholds ───────────────────────────────────────────
# Granular alerts for sdk.divinci.ai documentation site traffic and costs.
# SDK docs is a static-asset Worker (Astro/Starlight) with predictable traffic
# patterns. These thresholds complement the general WORKER_REQUEST_THRESHOLD.

# SDK docs daily estimated cost before alerting (default: $5/day)
SDK_DOCS_COST_THRESHOLD = "5"

# SDK docs daily request count before alerting (default: 100,000 requests)
# Context: A 10x spike would be ~100k requests; normal baseline is ~5-10k/day
SDK_DOCS_REQUEST_THRESHOLD = "100000"

# SDK docs daily error count before alerting (default: 100 errors)
# Context: A small percentage of requests may error due to cache misses / CF edge
# issues. 100+ errors/day suggests a deploy regression or upstream API problem.
SDK_DOCS_ERROR_THRESHOLD = "100"

# ── Workers AI (LLM inference) Threshold ─────────────────────────────────────
# Daily total Workers AI Neurons (across ALL models) before alerting.
# Neurons are the billable unit: $0.011 / 1,000 Neurons (~$0.000011 each).
# Baseline is <30k Neurons/day (~$0.30). The 2026-06-15 incident was 3.67M
# Neurons (~$40) in a single day, almost all @cf/moonshotai/kimi-k2.7-code
# (the fallback-chain tool-loop model). 500,000 Neurons ≈ $5.50/day catches a
# ~15x spike well before it compounds, without firing on embedding-heavy days.
# NOTE: alert-only — there is no CF API to throttle Workers AI per-model;
# mitigate in-app by dropping the offending model from the fallback chain.
AI_NEURONS_THRESHOLD = "500000"

# ── AI Gateway (external-provider LLM cost) ──────────────────────────────────
# Daily upstream-provider cost ($) routed through AI Gateway before alerting.
# This is spend billed by Gemini/Vertex/OpenAI (NOT the CF bill) — it catches
# LLM cost that Workers AI Neurons monitoring can't see. $0 for the workers-ai
# provider (Neurons bills that). Baseline ~$0.20/day; $5 catches a real spike.
AI_GATEWAY_COST_THRESHOLD = "5"

# ── Vectorize ────────────────────────────────────────────────────────────────
# Daily queried vector dimensions before alerting ($0.01 / 1M dims).
# 500M dims ≈ $5/day. Near-zero here (Qdrant-primary; Vectorize is cache-only).
VECTORIZE_DIMENSIONS_THRESHOLD = "500000000"

# ── Account-wide catch-all ───────────────────────────────────────────────────
# Total estimated daily spend ($) across CF-billable surfaces + GCP Cloud Run.
# Safety net for cost in a service without its own threshold (Images, Stream,
# KV, a new worker).
# Tuned 2026-06-17: the REAL total baseline is ~$130-140/day, dominated by GCP
# Cloud Run (CF is only ~$12/day). The old $50 was sized off the CF-only
# dashboard number and sat BELOW baseline, so it fired every single check. $300
# is ~2.2× the real baseline — catches a genuine runaway without nagging. (GCP
# also has its own CLOUD_RUN_MONTHLY_COST_THRESHOLD = $8000/mo ≈ $266/day.)
TOTAL_DAILY_SPEND_THRESHOLD = "300"

# ── PagerDuty: page on kills, not on breaches ───────────────────────────────
# "actions" pages ONLY when the switch actually did something (disconnected a
# route, set maxInstances=0, deleted a worker). A threshold breach it chose not
# to act on — anything below DISCONNECT_THRESHOLD_MULTIPLIER — still goes to
# Slack/Discord, just not to the pager.
#
# Set 2026-07-31. Before this, EVERY open PagerDuty incident was this alert:
# 12 of 12 over 30 days, one per UTC day at High urgency, each acknowledged and
# never resolved, and nothing else paged in that window. A pager carrying only
# a daily spend report is a pager nobody reads — the exact failure mode this
# worker exists to prevent for money. Kills still page. ("always" = old behaviour.)
PAGERDUTY_PAGE_ON = "actions"

# ── Alert de-dup ─────────────────────────────────────────────────────────────
# Suppress repeat Discord/Slack/custom alerts for the SAME violation set within
# this many hours. The cron runs every 5 min and daily-cumulative thresholds
# stay tripped all day once crossed — without this they'd repeat ~288×/day.
# PagerDuty is unaffected (it self-dedups via dedup_key). Requires the
# ALERT_STATE KV binding below; if unbound, de-dup is a no-op (alerts repeat).
ALERT_COOLDOWN_HOURS = "6"

# ── GCP Cloud Run Thresholds ────────────────────────────────────────────────
# Monitors Cloud Run services (public-api, public-api-live, webhook, open-parse).
# GCP_SERVICE_ACCOUNT_JSON, GCP_PROJECT_ID → set via `wrangler secret put`
GCP_REGION = "us-central1"

# Daily Cloud Run requests before alerting (default: 5 million)
CLOUD_RUN_REQUEST_THRESHOLD = "5000000"

# Max concurrent Cloud Run instances before alerting (default: 100)
# Context: Each instance = ~$0.09/hr (2 vCPU, 2GiB). 100 instances
# running continuously = ~$216/day = ~$6,480/month.
# Normal staging traffic peaks at ~30 instances during business hours.
CLOUD_RUN_INSTANCE_THRESHOLD = "100"

# Estimated monthly Cloud Run cost before alerting (default: $8000)
# Note: staging server-api peaks at 30-40 instances during business hours
# (~$170/day = $5,100/mo). Set with headroom above normal peaks.
CLOUD_RUN_MONTHLY_COST_THRESHOLD = "8000"

# ── Kill Switch Behavior ─────────────────────────────────────────────────────

# Auto-disconnect routes when thresholds exceeded (RECOMMENDED)
# Cloudflare: Removes custom domains and disables workers.dev subdomain.
# GCP Cloud Run: Sets maxInstances to 0 (stops new traffic).
# Both are reversible — code stays intact.
AUTO_DISCONNECT = "true"

# Auto-delete workers when thresholds exceeded (NUCLEAR — use with caution)
# Only applies to Cloudflare Workers. Permanently deletes the worker script.
# NOT reversible. Only enable if you'd rather lose code than money.
AUTO_DELETE = "false"

# Runaway guard: auto-disconnect/delete only fires when usage exceeds this
# MULTIPLE of the alert threshold — alerts still fire at 1×. This keeps the
# kill switch armed for genuine runaways while ordinary over-threshold traffic
# only alerts (never gets auto-disconnected). E.g. with 10×, a worker alerts at
# 10M reqs/day but is only auto-disconnected above 100M/day. Applies to Workers,
# Durable Objects, and Cloud Run. Minimum effective value is 1.
DISCONNECT_THRESHOLD_MULTIPLIER = "10"

# Workers that should NEVER be killed, even if they exceed thresholds.
# Comma-separated list of worker script names.
# Always include this kill switch worker itself!
# Also doubles as the protected list for GCP Cloud Run auto-disconnect (index.ts).
PROTECTED_WORKERS = "cloudflare-billing-kill-switch,divinci-agent-stage,divinci-agent-production,divinci-sdk-docs,divinci-sdk-docs-staging,divinci-production-server-api,divinci-production-server-api-live,divinci-production-api-webhook,divinci-staging-server-api,divinci-staging-server-api-live"

# ── Secrets ──────────────────────────────────────────────────────────────────
# Set these via `wrangler secret put <NAME>`
#
# REQUIRED:
#   CLOUDFLARE_API_TOKEN    — API token with permissions:
#                             - Account Analytics: Read
#                             - Account Workers Scripts: Edit (for auto-disconnect)
#                             - Account Workers Routes: Edit (for route removal)
#   CLOUDFLARE_ACCOUNT_ID   — Your Cloudflare account ID
#
# KILL SWITCH SERVICE:
#   KILL_SWITCH_AGENT_API_KEY — Agent API key from kill-switch.net dashboard
#                               (enables centralized multi-cloud monitoring)
#
# GCP MONITORING:
#   GCP_SERVICE_ACCOUNT_JSON — GCP service account JSON (needs roles:
#                               - monitoring.viewer (read Cloud Monitoring metrics)
#                               - run.developer (update service scaling)
#                               - iam.serviceAccountUser (actAs for revisions))
#   GCP_PROJECT_ID           — GCP project ID (e.g., "openai-api-4375643")
#
# ALERTING (at least one recommended):
#   PAGERDUTY_ROUTING_KEY   — PagerDuty Events API v2 integration key
#                             (pages on-call until acknowledged)
#   DISCORD_WEBHOOK_URL     — Discord channel webhook URL
#   SLACK_WEBHOOK_URL       — Slack incoming webhook (kill-switch default)
#   GCP_SLACK_WEBHOOK_URL   — Slack incoming webhook for /gcp-alert + /gcp-page
#                             (prefer #alerts; falls back to SLACK_WEBHOOK_URL)
#   CUSTOM_WEBHOOK_URL      — Any HTTP endpoint that accepts POST JSON
